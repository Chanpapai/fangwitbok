<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080b18" />
  <meta name="description" content="ฝากวิทฝากบอก — ฝากบอกเรื่องราวและตามหาของหายในโรงเรียน" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ฝากวิทฝากบอก" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>FangwitBok V2 — ฝากวิทฝากบอก</title>
  <script>
    try {
      var d = document.documentElement;
      if (localStorage.getItem("fwb_theme") === "light") d.classList.remove("dark");
      var a = localStorage.getItem("fwb_accent");
      if (a && /^[a-z]{3,10}$/.test(a)) d.setAttribute("data-accent", a);
    } catch (e) {}
  </script>
</head>
<body class="bg-slate-50 dark:bg-[#080b18] text-slate-800 dark:text-slate-100 antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
